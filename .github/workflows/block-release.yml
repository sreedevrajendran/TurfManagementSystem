name: Block Release Cron

on:
  schedule:
    # Run at the top of every hour (minute 0)
    - cron: "0 * * * *"
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  send-release-emails:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger block release endpoint
        run: |
          curl -s -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://eastwelfareturf.vercel.app/api/cron/block-release" \
            | jq .
