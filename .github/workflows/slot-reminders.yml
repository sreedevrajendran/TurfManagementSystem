name: Slot Reminder Cron

on:
  schedule:
    # Run every minute (GitHub Actions minimum is 1 minute)
    - cron: "* * * * *"
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger slot reminder endpoint
        run: |
          curl -s -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://eastwelfareturf.vercel.app/api/cron/slot-reminders" \
            | jq .
